site_name: acids-dataset
site_description: Pre-processing, online loading and sampling of audio datasets for generative models
repo_url: https://github.com/acids-ircam/acids-dataset
repo_name: acids-ircam/acids-dataset
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: light mode

nav:
  - Home: index.md
  - Step by step:
      - tutorial/index.md
      - 1. Installation: tutorial/01-installation.md
      - 2. A first dataset: tutorial/02-first-dataset.md
      - 3. Features: tutorial/03-features.md
      - 4. Outputs and augmentations: tutorial/04-outputs-augmentations.md
      - 5. Partitions: tutorial/05-partitions.md
      - 6. Pre-processing: tutorial/06-preprocessing.md
      - 7. Training: tutorial/07-training.md
      - 8. Going further: tutorial/08-going-further.md
  - Documentation:
      - guide/index.md
      - Datasets: guide/datasets.md
      - Data loaders: guide/loaders.md
      - Output patterns: guide/output-patterns.md
      - Partitions: guide/partitions.md
      - Balancing and curriculum: guide/sampling.md
      - Features: guide/features.md
      - Augmentations: guide/augmentations.md
      - Pre-processing: guide/preprocessing.md
      - Presets: guide/presets.md
      - Dataset browser and health: guide/browser.md
      - Command line: guide/cli.md
      - Extending: guide/extending.md
      - Development: guide/development.md
  - API reference:
      - reference/index.md
      - Datasets: reference/datasets.md
      - Features: reference/features.md
      - Sampling: reference/sampling.md
      - Pre-processing and presets: reference/preprocessing.md
      - Health and browser: reference/health.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            filters: ["!^_"]
            merge_init_into_class: true
            show_signature_annotations: false
            separate_signature: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
