# Tests on every supported Python version, and check of the minimum Python version required by the code.
# Long parametrized grids are marked as slow (see tests/conftest.py) and are not run here : run them locally with
# pytest -m slow.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-version:
    # fails if the code uses features of Python versions above requires-python (pyproject.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install vermin
      - run: vermin --target=3.10- --no-tips --eval-annotations --violations acids_dataset

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: system dependencies
        # FFmpeg libraries are used by torchcodec (audio decoding of torchaudio)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: python dependencies
        run: |
          pip install torch torchaudio torchcodec --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ui]" pytest pytest-timeout gradio_client
      - name: tests
        # test_transforms.py has known failures (see TODO.md)
        run: pytest tests -m "not slow" --ignore=tests/test_transforms.py -p no:warnings --timeout=900

  minimum-versions:
    # tests with the minimum versions of the scientific dependencies declared in pyproject.toml (pkg>=x is installed as pkg==x)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: python dependencies
        # the minimums are used as constraints, so that the other packages are resolved with compatible versions
        run: |
          grep -oE '"(numpy|scipy|scikit-learn|librosa)>=[^"]+"' pyproject.toml | tr -d '"' | sed 's/>=/==/' > minimum.txt
          cat minimum.txt
          pip install torch torchaudio torchcodec --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ui]" pytest pytest-timeout gradio_client -c minimum.txt
      - name: tests
        run: pytest tests -m "not slow" --ignore=tests/test_transforms.py -p no:warnings --timeout=900
