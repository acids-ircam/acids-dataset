[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "acids_dataset"
dynamic = ["version"]
authors = [
  { name="Axel Chemla Romeu Santos", email="chemla@ircam.fr" },
  { name="Nils Demerlé", email="demerle@ircam.fr" },
]
description = "a fancy data & data loader manager for generative audio ML. Enables pre-processing, advanced loading, audio features & augmentations, balance & partitioning, curriculum learning."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license-files = ["LICEN[CS]E*"]
dependencies = [
    "pytest",
    "grpcio-tools==1.71.0",
    "absl-py",
    "PyYAML",
    "gin-config",
    "lmdb",
    "tqdm",
    "dill",
    "numpy>=1.23.5",
    "scipy>=1.8",
    "scikit-learn>=1.0.2",
    "librosa>=0.10.2",
    "torch",
    "torchaudio",
    "torchcodec",
    "soundfile>=0.12",
    "pytorch_lightning",
    "pydub",
    "pyroomacoustics",
    "pyloudnorm",
    "nnaudio",
    "mir_eval",
    "resampy",
    "pretty_midi",
    "einops",
    "rotary_embedding_torch",
    "audiomentations",
    "acids-transforms @ git+https://github.com/acids-ircam/acids-transforms"
]

[project.scripts]
acids-dataset = "acids_dataset.cli:main"

[project.urls]
Homepage = "https://github.com/acids-ircam/acids-dataset"
Issues = "https://github.com/acids-ircam/acids-dataset/issues"

[tool.setuptools.packages.find]
# only acids_dataset is packaged (other top-level folders, e.g. assets or docs, are not packages)
include = ["acids_dataset*"]

[tool.setuptools.dynamic]
version = {attr = "acids_dataset.version.__version__"}

[tool.setuptools.package-data]
acids_dataset = ["configs/*.gin", "configs/features/*.gin", "configs/transforms/*.gin", "transforms/basic_pitch_torch/assets/*.pth"]

[project.optional-dependencies]
pesto = ["pesto-pitch"]
crepe = ["torchcrepe"]
pyworld = ["pyworld"]
ui = ["gradio>=4", "matplotlib"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26",
        # mkdocstrings < 1.0.8 (the last versions for Python 3.10) are not compatible with pymdown-extensions 12
        "pymdown-extensions<12; python_version < '3.11'"]

[tool.pytest.ini_options]
markers = [
    "slow: long parametrized grids (deselect with -m \"not slow\")",
]
